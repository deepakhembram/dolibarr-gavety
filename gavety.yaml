name: Dolibarr ERP & CRM
build:
  type: compose
compose:
  entry: web
  port: 80
resources:
  min_ram_mb: 1024
env:
  - name: DOLI_ADMIN_PASSWORD
    generate: true
  - name: DOLI_INSTANCE_UNIQUE_ID
    generate: true
# Dolibarr writes its links from the DOLI_URL_ROOT setting. Gavety fills in
# {prefix} with this app's fixed address, so links work on the LAN and remotely.
base_path:
  - env: DOLI_URL_ROOT
    value: "http://localhost{prefix}"
# Dolibarr reads the path of the request itself for its login form, so it must
# receive the full path, prefix included. The Apache setting in this repo
# makes it answer under that prefix.
keep_prefix: true
